server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers. nginx drops server-level add_header lines inside any
    # location that has its own add_header, so they are repeated per location.
    # CSP: the web app only loads its own bundle and only talks to its own
    # origin — /api/ is routed to the server by Caddy in production and by
    # the /api/ block below for local Docker. Even if someone managed to
    # inject script, it couldn't load code from elsewhere or send the
    # in-memory session token to another host.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Local Docker only: forward same-origin API calls to the server
    # container. In production Caddy answers /api/* before it reaches this
    # nginx. The variable + Docker's resolver make nginx look "server" up per
    # request, so this file still loads where no "server" host exists.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://server:4000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
    }

    # A real robots file instead of the SPA fallback page.
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
        try_files /robots.txt =404;
    }

    # expo-router uses client-side routing (single index.html) — every
    # unmatched path (e.g. /transactions, /input-expenses) must fall back
    # to index.html rather than 404, so a page refresh or direct link works.
    location / {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # index.html names the current hashed bundle: always revalidate it so a
        # new deploy shows up on the next load instead of a stale cached page.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Hashed static bundle assets can be cached indefinitely.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
