server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers. nginx drops server-level add_header lines inside any
    # location that has its own add_header, so they are repeated per location.
    # CSP: the web app only loads its own bundle; API calls go to the same
    # origin in production (Caddy) or localhost:4000 for local Docker. Even if
    # someone managed to inject script, it couldn't load code from elsewhere or
    # send the in-memory session token to another host.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:4000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # expo-router uses client-side routing (single index.html) — every
    # unmatched path (e.g. /transactions, /input-expenses) must fall back
    # to index.html rather than 404, so a page refresh or direct link works.
    location / {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }

    # Hashed static bundle assets can be cached indefinitely.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
