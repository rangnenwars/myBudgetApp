server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # expo-router uses client-side routing (single index.html) — every
    # unmatched path (e.g. /transactions, /input-expenses) must fall back
    # to index.html rather than 404, so a page refresh or direct link works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed static bundle assets can be cached indefinitely.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
