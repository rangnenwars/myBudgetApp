# Tests + image build check. Runs on every PR and non-main push, and is
# called by deploy.yml so production is only built from a commit that passed
# the same checks. Mirrors the .husky/pre-commit quality gate.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is covered by deploy.yml, which calls this workflow
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are cancelled; runs on main (via deploy.yml) never are.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run quality            # tsc --noEmit + jest with coverage thresholds

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mybudget
          POSTGRES_PASSWORD: mybudget_ci
          POSTGRES_DB: mybudget
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mybudget"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://mybudget:mybudget_ci@localhost:5432/mybudget
      JWT_ACCESS_SECRET: ci-access-secret-not-real
      JWT_REFRESH_SECRET: ci-refresh-secret-not-real
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run db:migrate         # every drizzle migration must apply cleanly to an empty DB
      - run: npm run db:seed            # tests expect the system categories
      - run: npm run quality            # tsc --noEmit + jest

  docker-build:
    # deploy.yml builds and pushes the real images right after, so skip the
    # throwaway build there.
    if: github.workflow != 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build web image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build server image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
