# Minor/patch bumps are grouped into one PR per ecosystem per week; major
# bumps still come one per PR so each breaking upgrade gets its own review.
# Merge only after the PR's `ci` checks are green — main deploys on merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      client-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      server-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/, /server]
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }
