services:
  mybudget-web:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - server

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mybudget
      POSTGRES_PASSWORD: mybudget_dev
      POSTGRES_DB: mybudget
    ports:
      # host 5433, not 5432 — this machine already runs a native Postgres
      # service on 5432; the server container still talks to this service
      # on the internal Docker network at "postgres:5432" regardless.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mybudget"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mybudget:mybudget_dev@postgres:5432/mybudget
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 4000
      # The web container's nginx proxies /api/ here, so trust one hop of
      # X-Forwarded-For for per-IP rate limits.
      TRUST_PROXY: 1
      # Report-issue nightly digest + SMTP — all optional; put the values in a
      # .env file next to this compose file (see server/.env.example).
      ISSUE_DIGEST_ENABLED: ${ISSUE_DIGEST_ENABLED:-false}
      ISSUE_DIGEST_TIME: ${ISSUE_DIGEST_TIME:-02:00}
      ISSUE_DIGEST_TO: ${ISSUE_DIGEST_TO:-}
      TZ: ${TZ:-Asia/Kolkata}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  pgdata:
